# ============================================================================
# Enhanced YOLOv12s — Weapon Detection: Architecture Search Reference
# Paper: Catargiu & Ciocoiu, "Real-Time Weapon Detection Using Enhanced
#        YOLOv12 Models and a Custom Dataset" (IEEE Access).
#
# Companion reference for Section IV-B ("over 40 distinct model variants were
# tested"). Each entry is a structurally DISTINCT model graph; training-recipe
# -only runs (loss / TAL / SWA / seed) are collapsed onto the architecture they
# share. Every variant = baseline YOLOv12s backbone+neck with append-only,
# zero-gated (gamma=0, identity-at-init) enhancement modules on the head.
#
# Base model : YOLOv12s (yolov12s.pt), scale s [0.50,0.50,1024], 640x640, nc=4
# Classes    : 0 knife, 1 pistol, 2 long_gun, 3 no_weapon
# Custom modules defined in: ultralytics/nn/modules/{block.py, head.py, conv.py}
#   registered in ultralytics/nn/tasks.py parse_model(); see gated_blocks.py
#   for the zero-gated design rationale + identity-at-init self-test.
# PROPOSED final model (paper's 'Custom architecture B1-B5') = run r38_globalctx_70:
#   ZGSmallDetail@P3 + ZGLSKAWideFuseV2@P4 + ZGLSKAWideFuse@P5 + ZGGlobalContext x3 + DetectAuxDual
# Distinct architectures: 123   |   Custom modules used: 48
# Generated: 2026-07-20
# ============================================================================

module_glossary:
  C2fASPP: "C2f block with Atrous Spatial Pyramid Pooling (multi-dilation context) at P3."
  C2fLSKA: "C2f with Large Separable Kernel Attention (LSKA)."
  C2fLSKA_MultiScale: "C2fLSKA variant fusing multiple kernel scales (5x5 + 9x9)."
  C2fLSKA_Residual: "C2fLSKA variant with an added residual connection."
  C2fLSKA_Weapon: "Weapon-optimized C2fLSKA (multi-scale + residual) variant."
  C2fSE: "C2f block with Squeeze-Excitation channel attention (early P3 exploration)."
  DetectAux: "Detect with a TRAIN-ONLY auxiliary detection head (deep supervision)."
  DetectAuxDual: "Detect with DUAL-PATH auxiliary supervision (detail teacher)."
  DetectAuxDualDeepP3: "DetectAuxDual with DEEPER P3 head towers (round 40)."
  DetectCGC: "Detect with Context-Gated Classification (CGC) — zero-gated head."
  DetectCosine: "Detect with a COSINE/prototype classification head (round 28)."
  DetectDecoupled: "Task-decoupled head: box and cls read SEPARATE feature maps."
  DetectDecoupledAux: "Decoupled box/cls head + train-only auxiliary deep supervision (rounds 24 + 20)."
  DetectDecoupledCosine: "DetectDecoupled (separate box/cls features) + cosine cls scoring (round 28)."
  DetectDecoupledObj: "Round 26 -- the SYNTHESIS: decoupled cls pathway + softened objectness."
  DetectDeepCls: "Detect with a DEEPER classification tower (4 blocks vs the stock 2)."
  DetectLKACls: "Detect with a per-scale, zero-gated Large-Kernel-Attention cls branch."
  DetectMultiProto: "Detect with a MIXTURE (multi-prototype) classification head (round 30)."
  DetectObj: "Detect + explicit objectness (foreground/background) branch."
  DetectSmallCls: "Detect with a per-scale, zero-gated SMALL-kernel (local-detail) cls branch."
  DetectWideCls: "Detect with a WIDER classification tower (2x cls channels, stock depth)."
  DySample: "Dynamic content-aware upsampler (DySample, ICCV 2023), 'lp' style."
  SPPF: "Spatial Pyramid Pooling - Fast (SPPF) layer for YOLOv5 by Glenn Jocher."
  WeightedConcat: "Round 19 -- BiFPN-style learnable weighted fusion (drop-in for Concat)."
  ZGDCN: "Zero-gated Deformable Convolution — ADAPTIVE spatial context."
  ZGDSConv: "Zero-gated Dynamic Snake Convolution — shape prior for elongated objects."
  ZGGC: "Zero-gated Global Context block (GCNet-style) — for P5 / large objects."
  ZGGatherContext: "Global CROSS-SCALE context injected into the finest level -- AXIS: gather- distribute neck (Gold-YOLO-style global fusion vs the local PAN)."
  ZGGlobalContext: "Global-context block (GCNet / non-local-lite) -- AXIS: global context modeling."
  ZGGlobalContext2: "globalctx + max-pool branch (avg+max global descriptor) -- the last-arch refinement of the round-38 winner."
  ZGLSKA: "Zero-gated large-kernel context branch."
  ZGLSKACompactFuse: "Round 16 — WideFuse shape, but swap the elongated strip-23 branch for a COMPACT multi-scale SMALL-kernel branch (k3/dilation1 + k5/dilation2)."
  ZGLSKAExpand: "Round 11 [idea 4] — capacity-expanded k11: is k11 RF-limited or capacity-limited?"
  ZGLSKAGCFuse: "Round 14 — fuse k_sq LKA (local, proven) with GCNet-style global context, full-width streams (WideFuse structure), one gamma."
  ZGLSKAMultiDil: "Round 10 — single-branch multi-scale LKA: k7/dilation2 AND k11/dilation3 fused into one attention map under one gamma, instead of picking one k."
  ZGLSKARefine: "Round 11 [idea 3] — sequential local-refinement after the proven k11 branch."
  ZGLSKASG: "Spatially-gated ZGLSKA -- round 9, built on the round-7 dose-response winner."
  ZGLSKASelectFuse: "Round 17 — spatially content-ADAPTIVE receptive-field routing @ P4-BU."
  ZGLSKAStripFuse: "Round 10 — fuse the two best single-branch shapes (k11 square + strip23) in ONE gated branch via channel-split, instead of stacking two gates."
  ZGLSKAWideFuse: "Round 11 [idea 2] — fuse k11 (square) + strip23 WITHOUT channel-starvation."
  ZGLSKAWideFuse3: "Round 15 — WideFuse + a NEW small-receptive-field detail branch, one gamma."
  ZGLSKAWideFuseV2: "Round 31 -- The Hybrid Branch WideFuse."
  ZGMHSA: "Zero-gated multi-head self-attention — intended for P5 (20x20 tokens)."
  ZGP2Fuse: "Zero-gated P2 -> P3 detail fusion (small-object enrichment)."
  ZGSE: "Zero-gated Squeeze-Excitation."
  ZGSmallDetail: "Round 30 — zero-gated small-kernel detail guard for P3 features."
  ZGStar: "Zero-gated STAR block — multiplicative feature mixing (StarNet, 2024)."
  ZGStrip: "Zero-gated SEPARABLE strip-kernel attention (1xk + kx1) — for elongated objects."

architectures:
  - id: arch_001
    name: "arch_p3_attn_70"
    description: "P3 attention enabled (simplest change)"
    components: []   # stock YOLOv12s graph
    model_yaml: |
      # YOLOv12s + P3 Head Attention
      nc: 4
      scales:
        s: [0.50, 0.50, 1024]

      backbone:
        - [-1, 1, Conv,  [64, 3, 2]]
        - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
        - [-1, 2, C3k2,  [256, False, 0.25]]
        - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
        - [-1, 2, C3k2,  [512, False, 0.25]]
        - [-1, 1, Conv,  [512, 3, 2]]
        - [-1, 4, A2C2f, [512, True, 4]]
        - [-1, 1, Conv,  [1024, 3, 2]]
        - [-1, 4, A2C2f, [1024, True, 1]]

      head:
        - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
        - [[-1, 6], 1, Concat, [1]]
        - [-1, 2, A2C2f, [512, False, -1]]

        - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
        - [[-1, 4], 1, Concat, [1]]
        - [-1, 2, A2C2f, [256, True, 4]]          # 14 — P3 with ATTENTION

        - [-1, 1, Conv, [256, 3, 2]]
        - [[-1, 11], 1, Concat, [1]]
        - [-1, 2, A2C2f, [512, False, -1]]

        - [-1, 1, Conv, [512, 3, 2]]
        - [[-1, 8], 1, Concat, [1]]
        - [-1, 2, C3k2, [1024, True]]

        - [[14, 17, 20], 1, Detect, [nc]]

