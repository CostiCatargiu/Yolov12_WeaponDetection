  - id: arch_010
    name: "arch_dual_p3_70"
    description: "[6/6] Dual-path P3 — lightweight + heavy merged (HIGHEST RISK)"
    components: []   # stock YOLOv12s graph
    model_yaml: |
      # Dual-Path P3 Head — lightweight + heavy branches
      nc: 4
      scales:
        s: [0.50, 0.50, 1024]

      backbone:
        - [-1, 1, Conv,  [64, 3, 2]]
        - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
        - [-1, 2, C3k2,  [256, False, 0.25]]
        - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
        - [-1, 2, C3k2,  [512, False, 0.25]]
        - [-1, 1, Conv,  [512, 3, 2]]
        - [-1, 4, A2C2f, [512, True, 4]]
        - [-1, 1, Conv,  [1024, 3, 2]]
        - [-1, 4, A2C2f, [1024, True, 1]]

      head:
        - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
        - [[-1, 6], 1, Concat, [1]]
        - [-1, 2, A2C2f, [512, False, -1]]        # 11

        - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
        - [[-1, 4], 1, Concat, [1]]               # 13 — concat for P3

        # Dual path split
        - [-1, 1, A2C2f, [128, False, 1]]         # 14 — Path A: lightweight (1 rep, 128ch)
        - [13, 3, A2C2f, [256, False, 3]]         # 15 — Path B: heavy (3 reps, 256ch)

        # Merge paths
        - [[14, 15], 1, Concat, [1]]              # 16 — concat both paths (128+256=384ch)
        - [-1, 1, Conv, [256, 1, 1]]              # 17 — project to standard 256ch

        - [-1, 1, Conv, [256, 3, 2]]
